<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoologie Obratlovců - Interaktivní Test</title>
    <style>
        :root { 
            --primary: #1a5f7a;    
            --accent: #57c5b6;     
            --success: #2ecc71;    
            --danger: #e74c3c;     
            --text: #2c3e50;
            --bg-gradient: linear-gradient(135deg, #1a5f7a 0%, #002b5b 100%);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* Přilepení k horní hraně */
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            width: 100%; 
            background: white; 
            padding: 30px; 
            border-radius: 0 0 24px 24px; /* Zaoblení jen dole */
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            box-sizing: border-box;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .q-info { font-weight: 800; color: var(--primary); }
        
        .group-tag { 
            background: var(--primary); 
            color: white;
            padding: 5px 12px; 
            border-radius: 100px; 
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .question-text { 
            font-size: 1.4em; 
            font-weight: 700;
            margin-bottom: 25px; 
            line-height: 1.3; 
            color: var(--text); 
        }

        /* Hlavní kontejner pro blok odpovědí */
        .options-wrapper { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding: 20px;
            background: #f1f5f9; 
            border: 3px solid #cbd5e1; 
            border-radius: 20px;
        }

        .opt { 
            padding: 18px 20px; 
            /* Výrazný rámeček pro každou možnost */
            border: 2px solid #7397c3; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            background: white; 
            text-align: left; 
            font-size: 1.05em;
            font-weight: 600;
            color: var(--text);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
        }

        .opt:hover:not(:disabled) { 
            border-color: var(--primary); 
            transform: translateX(8px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .opt.correct { 
            background: var(--success) !important; 
            color: white; 
            border-color: #1e8449;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4);
        }

        .opt.wrong { 
            background: var(--danger) !important; 
            color: white; 
            border-color: #a93226;
        }

        #next-btn { 
            margin-top: 25px; 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 14px; 
            background: var(--primary); 
            color: white; 
            font-size: 1.1em; 
            font-weight: 700;
            cursor: pointer; 
            display: none; 
            box-shadow: 0 8px 15px rgba(26, 95, 122, 0.2);
        }

        /* Mobilní optimalizace */
        @media (max-width: 600px) {
            .container { padding: 20px; border-radius: 0; }
            .question-text { font-size: 1.2em; }
            .options-wrapper { padding: 12px; gap: 10px; }
            .opt { padding: 14px 16px; font-size: 1em; border-width: 2px; }
        }

        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #7f8c8d; /* Decentní šedá */
            font-size: 0.7em;
            font-weight: 600;
            padding: 5px 10px;
            border: 1px solid #d1d9e0;
            border-radius: 8px;
            transition: all 0.2s;
            margin-bottom: 10px; /* Mezera pod tlačítkem */
        }

        .back-link:hover {
            background: #f1f5f9;
            color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>

let testQuestions = [];
let currentIdx = 0;
let score = 0;
let currentShuffledOptions = [];

function initTest() {
    // Logika výběru 5 a 6 otázek ze skupin (pro ukázku bere vše co je v rawData)
    const groups = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    const targets = { A: 2, B: 2, C: 2, D: 8, E: 8, F: 9, G: 9 };
    
    let pool = [];
    groups.forEach(group => {
        let filtered = rawData.filter(q => q.g === group);
        filtered.sort(() => Math.random() - 0.5);
        pool.push(...filtered.slice(0, targets[group]));
    });
    
    testQuestions = pool.sort(() => Math.random() - 0.5);
    if(testQuestions.length === 0) testQuestions = rawData.slice(0, 40); // Pojistka pro prázdný pool
    renderQuestion();
}

function renderQuestion() {
    const q = testQuestions[currentIdx];
    document.getElementById('q-counter').innerText = `Otázka ${currentIdx + 1}/${testQuestions.length}`;
    document.getElementById('group-name').innerText = `Skupina ${q.g}`;
    document.getElementById('q-text').innerText = q.q;
    
    const optionsBox = document.getElementById('q-options');
    optionsBox.innerHTML = '';
    
    // --- NÁHODNÉ MÍCHÁNÍ ODPOVĚDÍ ---
    // Vytvoříme pole objektů, kde si držíme informaci, zda byla odpověď původně správná
    currentShuffledOptions = q.o.map((text, index) => ({
        text: text,
        isCorrect: index === q.a
    }));
    
    // Zamícháme toto pole
    currentShuffledOptions.sort(() => Math.random() - 0.5);

    currentShuffledOptions.forEach((optObj, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = optObj.text;
        btn.onclick = () => check(i, btn);
        optionsBox.appendChild(btn);
    });
    
    document.getElementById('next-btn').style.display = 'none';
}

function check(selectedIndex, selectedBtn) {
    const allBtns = document.querySelectorAll('.opt');
    allBtns.forEach(b => b.disabled = true);
    
    let correctBtnIndex = currentShuffledOptions.findIndex(o => o.isCorrect);
    
    if(currentShuffledOptions[selectedIndex].isCorrect) {
        selectedBtn.classList.add('correct');
        score++;
    } else {
        selectedBtn.classList.add('wrong');
        allBtns[correctBtnIndex].classList.add('correct'); // Ukázat správnou
    }
    document.getElementById('next-btn').style.display = 'block';
}

function handleNext() {
    currentIdx++;
    if(currentIdx < testQuestions.length) renderQuestion();
    else showResult();
}

function showResult() {
    document.getElementById('quiz-box').innerHTML = `
        <div style="text-align:center; padding: 20px;">
            <h2 style="color:var(--primary)">Test dokončen!</h2>
            <p style="font-size: 1.8em; margin: 20px 0;">Skóre: <b>${score}</b> / ${testQuestions.length}</p>
            <button onclick="location.reload()" class="opt" style="text-align:center">Zkusit znovu</button>
        </div>`;
}

initTest();
</script>
